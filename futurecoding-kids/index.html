<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FutureKids AI</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/futurekids-logo-square.png" />
    <meta name="theme-color" content="#ffeb99" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body style="background:#fff8e9">
    <div id="root">
      <!-- Shown only until the app starts. If it stays, the app isn't running through Vite. -->
      <div style="max-width:560px;margin:10vh auto;padding:28px;border-radius:28px;background:#fff;font-family:system-ui,sans-serif;color:#33305a;text-align:center;box-shadow:0 16px 40px rgba(90,70,160,.15)">
        <div style="font-size:56px">🤖</div>
        <h1 style="font-size:24px;margin:8px 0">FutureKids is starting…</h1>
        <p style="line-height:1.6">If this message doesn't go away, the app isn't running yet.<br />
          Open a terminal in the project folder and run:<br />
          <code style="background:#f3efff;padding:2px 6px;border-radius:6px">npm install</code> then
          <code style="background:#f3efff;padding:2px 6px;border-radius:6px">npm run dev</code><br />
          and open <strong>http://localhost:5173</strong> (don't double-click index.html).</p>
      </div>
    </div>
    <noscript>FutureKids needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
